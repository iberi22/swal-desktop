[package]
name = "swal-ambient-orb"
version = "0.1.0"
edition = "2021"
authors = ["SouthWest AI Labs <agent@southwest-ai-labs.com>"]
description = "Ambient Voice & Thought Reactive Orb Surface for SWAL Desktop"

[[bin]]
name = "swal-orb"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.8"
naga = { version = "24.0", features = ["wgsl-in"] }

