[package]
name = "swal-vision-rs"
version = "0.1.0"
edition = "2021"
authors = ["SouthWest AI Labs <agent@southwest-ai-labs.com>"]
description = "Zero-ML hand gesture detector & presence monitor via V4L2 for SWAL Desktop"

[[bin]]
name = "swal-vision"
path = "src/main.rs"

[lib]
name = "swal_vision_rs"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
