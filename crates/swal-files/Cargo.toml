[package]
name = "swal-files"
version = "0.1.0"
edition = "2021"
authors = ["SouthWest AI Labs <agent@southwest-ai-labs.com>"]
description = "Modern Minimalist Agentic File Manager Core in Rust, inspired by files-community/Files"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
walkdir = "2.4"
libc = "0.2"
notify = "6.1"
swal-a2ui-engine = { path = "../swal-a2ui-engine" }
tar = "0.4"
flate2 = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
crossterm = "0.28"



[dev-dependencies]
tempfile = "3.8"
