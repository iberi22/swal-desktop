[package]
name = "swal-node-daemon"
version = "0.1.0"
edition = "2021"
authors = ["SouthWest AI Labs <agent@southwest-ai-labs.com>"]
description = "Async Tokio Coordinator & Xavier Bridge Node Daemon for SWAL Desktop"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "swal-settings"
path = "src/settings_cli.rs"
