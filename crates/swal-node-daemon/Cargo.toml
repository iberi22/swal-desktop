[package]
name = "swal-node-daemon"
version = "0.1.0"
edition = "2021"
authors = ["SouthWest AI Labs <agent@southwest-ai-labs.com>"]
description = "Async Tokio Coordinator & Xavier Bridge Node Daemon for SWAL Desktop"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swal-telemetry-rs = { path = "../swal-telemetry-rs" }
swal-a2ui-engine = { path = "../swal-a2ui-engine" }
swal-ambient-orb = { path = "../swal-ambient-orb" }
swal-widget-vault = { path = "../swal-widget-vault" }
swal-render-pipeline = { path = "../swal-render-pipeline" }

[dev-dependencies]
tempfile = "3.8"
