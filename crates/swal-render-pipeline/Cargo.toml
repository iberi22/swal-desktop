[package]
name = "swal-render-pipeline"
version = "0.1.0"
edition = "2021"
authors = ["SouthWest AI Labs <agent@southwest-ai-labs.com>"]
description = "High-refresh 200Hz+ lock-free Wayland layer shell compositor and render loop for SWAL Desktop"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
wgpu = "24.0"
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }
swal-ambient-orb = { path = "../swal-ambient-orb" }
swal-a2ui-engine = { path = "../swal-a2ui-engine" }


[dev-dependencies]
tempfile = "3.8"
