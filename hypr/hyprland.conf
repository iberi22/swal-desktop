# ═══════════════════════════════════════════════════════════════════════════════
# ⚡ SWAL Hyprland Config — Cyber-Minimalist
# SouthWest AI Labs ⚡
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Monitors ──────────────────────────────────────────────────────────────
monitor=,preferred,auto,1

# ─── Environment ───────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = NIXOS_OZONE_WL,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = MOZ_ENABLE_WAYLAND,1

# ─── Startup ───────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = systemctl --user start polkit-gnome-authentication-agent-1 2>/dev/null || true
exec-once = nm-applet --indicator
exec-once = blueman-applet
# pipewire & wireplumber are managed by NixOS services.pipewire
exec-once = sleep 1 && hyprctl setcursor phinger-cursors 24

# ─── Input ─────────────────────────────────────────────────────────────────
input {
    kb_layout = la-latin1
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1
    touchpad {
        natural_scroll = false
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
    }

    sensitivity = 0
    accel_profile = flat
}

# ─── General ───────────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00ff88cc) rgba(00ccffcc) 45deg
    col.inactive_border = rgba(2a2a3ecc)
    cursor_inactive_timeout = 3
    layout = master
    allow_tearing = false
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

# ─── Decorations ──────────────────────────────────────────────────────────
decoration {
    rounding = 8
    active_opacity = 0.98
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        contrast = 0.9
        brightness = 0.9
        vibrancy = 0.2
        noise = 0.01
        popups = true
        popups_ignorealpha = 0.6
    }
    drop_shadow = true
    shadow_range = 12
    shadow_render_power = 3
    col.shadow = rgba(00aa6640)
}

# ─── Animations ─────────────────────────────────────────────────────────
animations {
    enabled = true
    bezier = swal-ease, 0.2, 0.8, 0.3, 1.0
    bezier = swal-bounce, 0.4, 0.0, 0.2, 1.4
    animation = windows, 1, 6, swal-ease, popin 80%
    animation = windowsOut, 1, 5, swal-ease, popin 80%
    animation = fade, 1, 5, swal-ease
    animation = border, 1, 8, swal-bounce
    animation = workspaces, 1, 6, swal-ease, slide
    animation = specialWorkspace, 1, 5, swal-ease, slidevert
}

# ─── Layout: Master ─────────────────────────────────────────────────────
master {
    new_status = master
    mfact = 0.55
    orientation = center
    smart_resizing = true
    allow_small_split = true
}

# ─── Window Rules ──────────────────────────────────────────────────────
windowrule = float, ^(pavucontrol)$
windowrule = float, ^(blueman-manager)$
windowrule = float, ^(nm-connection-editor)$
windowrule = float, ^(org.gnome.Nautilus)$
windowrule = float, title:^(File Operation Progress)$
windowrule = opacity 0.95 0.85, ^(kitty)$
windowrule = opacity 0.95 0.85, ^(Alacritty)$
windowrule = opacity 0.95 0.90, ^(firefox)$
windowrule = opacity 0.95 0.90, ^(Chromium)$
windowrule = idleinhibit focus, ^(mpv)$
windowrule = noborder, fullscreen:1
windowrule = suppressevent maximize, fullscreen:1

# ─── Workspace Mapping ───
windowrulev2 = workspace 1, class:^(kitty)$
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 2, class:^(Chromium)$
windowrulev2 = workspace 3, title:^(AI Canvas)$
windowrulev2 = workspace 4, class:^(eww)$
windowrulev2 = workspace 4, class:^(waybar)$

# ─── Keybinds ────────────────────────────────────────────────────────────

# ── Launcher ──
bind = SUPER, SPACE, exec, rofi -show drun
bind = SUPER, R, exec, rofi -show run
bind = SUPER, E, exec, rofi -show filebrowser
bind = SUPER SHIFT, C, exec, swal-config-menu

# ── Terminal ──
bind = SUPER, Return, exec, kitty
bind = SUPER, T, exec, kitty
bind = SUPER SHIFT, Return, exec, kitty --class floating

# ── Close ──
bind = SUPER, Q, killactive

# ── Fullscreen ──
bind = SUPER, F, fullscreen, 1
bind = SUPER SHIFT, F, fullscreen, 0

# ── Float / Toggle ──
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo
bind = SUPER SHIFT, P, togglesplit

# ── Focus ──
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# ── Move Window ──
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# ── Resize ──
bind = SUPER CTRL, left, resizeactive, -40 0
bind = SUPER CTRL, right, resizeactive, 40 0
bind = SUPER CTRL, up, resizeactive, 0 -40
bind = SUPER CTRL, down, resizeactive, 0 40
bind = SUPER CTRL, h, resizeactive, -40 0
bind = SUPER CTRL, l, resizeactive, 40 0
bind = SUPER CTRL, k, resizeactive, 0 -40
bind = SUPER CTRL, j, resizeactive, 0 40

# ── Widgets ──
bind = SUPER, D, exec, eww open --toggle dashboard

# ── Workspaces (4 preconfigurados) ──
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# ── Scratchpad ──
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# ── Media keys ──
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ── Screenshots ──
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim - | wl-copy
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy

# ── Lock & Power ──
bind = SUPER CTRL, L, exec, hyprlock
bind = SUPER, Escape, exec, wlogout -p layer-shell
bind = SUPER CTRL ALT, Delete, exec, systemctl poweroff
bind = SUPER CTRL ALT, R, exec, systemctl reboot

# ── Gestures ──
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
}

# ─── Misc ─────────────────────────────────────────────────────────────
misc {
    disable_autoreload = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty|foot)$
    mouse_move_enables_dpms = true
    key_press_enables_dpms = false
    vfr = true
    vrr = 0
    render_ahead_of_time = false
    focus_on_activate = true
    no_direct_scanout = false
}

# ─── Binds ───────────────────────────────────────────────────────────
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
