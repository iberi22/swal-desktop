exec-once = /nix/store/2avx2c74smgw4ghki0qlnc0scgpfycbl-dbus-1.16.2/bin/dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
# exec-once=hyprctl plugin load /nix/store/sqikq3k375ngwnzjg3d8kmxilvpxirqg-Hyprspace-0.1+date=2026-05-28_c109256/lib/libHyprspace.so  # DISABLED: incompatible with Hyprland 0.49.0
# ═══════════════════════════════════════════════════════════════════════════════
# ⚡ SWAL Hyprland Config — Cyber-Minimalist
# SouthWest AI Labs ⚡
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Monitors ──────────────────────────────────────────────────────────────
monitor=,highrr,auto,1

# ─── Environment ───────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,phinger-cursors
env = QT_QPA_PLATFORMTHEME,gtk2
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = NIXOS_OZONE_WL,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = MOZ_ENABLE_WAYLAND,1
env = PROTON_ENABLE_WAYLAND,1
env = BROWSER,brave
env = GTK_THEME,catppuccin-frappe-blue-standard:dark

# ─── Startup ───────────────────────────────────────────────────────────────
exec-once = dunst -conf ~/.config/dunst/dunstrc
exec-once = hyprpaper
exec-once = hypridle
exec-once = systemctl --user start polkit-gnome-authentication-agent-1 2>/dev/null || true
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = sleep 1 && hyprctl setcursor phinger-cursors 24
exec-once = cliphist wipe  # Clean clipboard history on startup
exec-once = wl-paste --watch cliphist store  # Start clipboard history daemon
exec-once = wlsunset -l 4.71 -74.02  # Night light (Bogotá, Colombia)
exec-once = xdg-settings set default-web-browser brave-browser.desktop  # Set default browser
# Zero-Eww: EWW disabled — native Rust shell (swal-node-daemon) replaces it.
# exec-once = eww daemon
exec-once = swal-node-daemon --daemon  # Native SWAL shell supervisor (dashboard/orb/files IPC)
exec-once = sleep 2 && swal-theme-switch restore  # Apply saved UI theme (classic/noctalia/dank)
exec-once = ~/.config/hypr/scripts/osd-daemon.sh  # OSD volume overlay daemon
exec-once = ~/.config/hypr/scripts/epomaker-knob.py  # Epomaker TH80 SE knob volume

# ─── Input ─────────────────────────────────────────────────────────────────
input {
    kb_layout = us,latam
    kb_variant =
    kb_model =
    kb_options = caps:escape,compose:ralt
    kb_rules =

    follow_mouse = 1
    touchpad {
        natural_scroll = false
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
    }

    sensitivity = 0
    accel_profile = flat
}

# ─── General ───────────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00ff88cc) rgba(00ccffcc) 45deg
    col.inactive_border = rgba(2a2a3ecc)
    layout = master
    allow_tearing = false
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

# ─── Cursor ──────────────────────────────────────────────────────────────
cursor {
    inactive_timeout = 3
}

# ─── Decorations ──────────────────────────────────────────────────────────
decoration {
    rounding = 8
    active_opacity = 0.98
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        contrast = 0.9
        brightness = 0.9
        vibrancy = 0.2
        noise = 0.01
        popups = true
        popups_ignorealpha = 0.6
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00aa6640)
    }
}

# ─── Animations ─────────────────────────────────────────────────────────
animations {
    enabled = true
    bezier = swal-ease, 0.2, 0.8, 0.3, 1.0
    bezier = swal-bounce, 0.4, 0.0, 0.2, 1.4
    animation = windows, 1, 6, swal-ease, popin 80%
    animation = windowsOut, 1, 5, swal-ease, popin 80%
    animation = fade, 1, 5, swal-ease
    animation = border, 1, 8, swal-bounce
    animation = workspaces, 1, 6, swal-ease, slide
    animation = specialWorkspace, 1, 5, swal-ease, slidevert
}

# ─── Layout: Master ─────────────────────────────────────────────────────
master {
    new_status = master
    mfact = 0.55
    orientation = center
    smart_resizing = true
    allow_small_split = true
}

# ─── Window Rules ──────────────────────────────────────────────────────
windowrule = float, ^(pavucontrol)$
windowrule = float, ^(blueman-manager)$
windowrule = float, ^(nm-connection-editor)$
windowrule = float, ^(org.gnome.Nautilus)$
windowrule = float, ^(nemo)$
windowrule = opacity 0.88 0.80, ^(nemo)$
windowrule = float, title:^(File Operation Progress)$
windowrule = float, ^(xdg-desktop-portal)$
windowrule = opacity 0.95 0.85, ^(kitty)$
windowrule = opacity 0.95 0.85, ^(Alacritty)$
windowrule = opacity 0.95 0.85, ^(Ghostty)$
windowrule = opacity 0.95 0.90, ^(firefox)$
windowrule = opacity 0.95 0.90, ^(Brave-browser)$
windowrule = idleinhibit focus, ^(mpv)$
windowrule = idleinhibit focus, ^(obs)$
windowrule = noborder, fullscreen:1
windowrule = suppressevent maximize, fullscreen:1

# ─── Workspace Mapping ───
windowrulev2 = workspace 1, class:^(kitty)$
windowrulev2 = workspace 1, class:^(Ghostty)$
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 2, class:^(Brave-browser)$
windowrulev2 = workspace 3, title:^(AI Canvas)$
windowrulev2 = workspace 4, class:^(eww)$
windowrulev2 = workspace 4, class:^(waybar)$

# ═══ Gaming: Allow keyboard shortcuts during fullscreen games ═══
# windowrulev2 = noinputgrab, class:^(steam_app_.*)$  # DISABLED - caused mouse look lock in Halo

# ─── Keybinds ────────────────────────────────────────────────────────────

# ── Keyboard Layout Switcher ──
bind = SUPER, SPACE, exec, ~/.config/hypr/scripts/switch-layout.sh
bind = SUPER, R, exec, rofi -show run -theme ~/.config/rofi/config.rasi
bind = SUPER, E, exec, swal-files
bind = SUPER SHIFT, E, exec, rofi -show filebrowser -theme ~/.config/rofi/config.rasi

# ── App Grid (fullscreen) ──
bind = SUPER, D, exec, rofi -show drun -show-icons -fullscreen -theme ~/.config/rofi/config.rasi -theme-str 'listview{columns:5;lines:3;} window{width:900px;} inputbar{enabled:false;}'

# ── SWAL Native Dashboard (Zero-Eww) ──
bind = SUPER, Escape, exec, swal-desktop-ctl toggle-dashboard

# ── Overview (Super+Tab, estilo Windows) ──
# bind = SUPER, Tab, overview:toggle

# ── Terminal ──
bind = SUPER, Return, exec, ghostty
bind = SUPER, T, exec, ghostty
bind = SUPER SHIFT, Return, exec, ghostty --class=floating

# ── Zoom en Ghostty con Ctrl+Scroll ──
# Ghostty no soporta Ctrl+scroll nativamente para zoom,
# así que Hyprland intercepta y envía Ctrl+= / Ctrl+- via wtype
# mouse_down=scroll down=zoom out (-), mouse_up=scroll up=zoom in (+)
# bind = CTRL, mouse_up, exec, wtype -M ctrl -k equal -m ctrl
# bind = CTRL, mouse_down, exec, wtype -M ctrl -k minus -m ctrl

# ── Clipboard ──
bind = SUPER, B, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/config.rasi -p " History" | cliphist decode | wl-copy
bind = SUPER SHIFT, B, exec, cliphist wipe && notify-send "Clipboard" "History cleared"

# ── Close ──
bind = SUPER, Q, exec, swal-desktop-ctl close-files || ~/.config/hypr/scripts/smart_close.sh

# ── Fullscreen ──
bind = SUPER, F, exec, ~/.config/hypr/scripts/fullscreen_toggle.sh
bind = SUPER SHIFT, F, fullscreen, 1


# ── Float / Toggle ──
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo
bind = SUPER SHIFT, P, layoutmsg, orientationcycle

# ── Always on top / Pin ──
bind = SUPER SHIFT, T, pin, active          # Pin ventana a todos los workspaces
bind = SUPER SHIFT, SPACE, alterzorder, top, active  # Traer al frente

# ── Focus ──
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# ── Move Window ──
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# ── Resize ──
bind = SUPER CTRL, left, resizeactive, -40 0
bind = SUPER CTRL, right, resizeactive, 40 0
bind = SUPER CTRL, up, resizeactive, 0 -40
bind = SUPER CTRL, down, resizeactive, 0 40
bind = SUPER CTRL, h, resizeactive, -40 0
bind = SUPER CTRL, l, resizeactive, 40 0
bind = SUPER CTRL, k, resizeactive, 0 -40
bind = SUPER CTRL, j, resizeactive, 0 40

# ── Workspaces (4 preconfigurados) ──
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

# ── Alt+Tab: Cycle workspaces (Windows-style) ──
bind = ALT, Tab, workspace, e+1
bind = ALT SHIFT, Tab, workspace, e-1

# bind = SUPER, mouse_down, workspace, e+1
# bind = SUPER, mouse_up, workspace, e-1

# ── Scratchpad ──
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, grave, movetoworkspace, special:magic

# ── Media keys ──
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5% && eww update osd_icon="󰃟" osd_label="$(brightnessctl get 2>/dev/null | awk -v max="$(brightnessctl max 2>/dev/null)" '{printf "%d%%", $1*100/max}')" osd_pct="$(brightnessctl get 2>/dev/null | awk -v max="$(brightnessctl max 2>/dev/null)" '{printf "%d", $1*120/max}')" && eww open osd && (sleep 1.5 && eww close osd) &
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && eww update osd_icon="󰃟" osd_label="$(brightnessctl get 2>/dev/null | awk -v max="$(brightnessctl max 2>/dev/null)" '{printf "%d%%", $1*100/max}')" osd_pct="$(brightnessctl get 2>/dev/null | awk -v max="$(brightnessctl max 2>/dev/null)" '{printf "%d", $1*120/max}')" && eww open osd && (sleep 1.5 && eww close osd) &
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
# ── Teclas directas Epomaker TH80 SE (Consumer Control) ──
# NOTA: Comentados porque CODE:113/114/115 interceptan las flechas izquierda/derecha
# cuando el teclado está en ciertas capas. El knob ya lo maneja epomaker-knob.py vía evdev,
# y las teclas multimedia estándar (XF86Audio*) están cubiertas arriba.
#bind = , code:115, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
#bind = , code:114, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bind = , code:113, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ── Screenshots (estilo Windows: Super+Shift+S) ──
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh screen
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot.sh window
bind = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot.sh delay

# ── Color Picker ──
bind = SUPER, C, exec, ~/.config/hypr/scripts/colorpicker.sh

# ── System Info ──
bind = SUPER, I, exec, fastfetch

# ── Lock & Power ──
bind = SUPER CTRL, L, exec, hyprlock
#bind = SUPER, Escape, exec, wlogout -p layer-shell
bind = SUPER CTRL ALT, Delete, exec, systemctl poweroff
bind = SUPER CTRL ALT, R, exec, systemctl reboot

# ── Gestures ──
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
}


# ─── Debug ───────────────────────────────────────────────────────────
debug {
    suppress_errors = true
    full_cm_proto = true
}
# ─── Misc ─────────────────────────────────────────────────────────────
misc {
    disable_autoreload = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty|foot|Ghostty)$
    mouse_move_enables_dpms = true
    key_press_enables_dpms = false
    vrr = 0  # fix-halo-fps: off para evitar present stall ~90fps (era vrr=1 siempre-on)
    focus_on_activate = true
}

# ── Window Rules: Gaming ──
# Enable immediate presentation (tearing bypass) for fullscreen games
# This eliminates compositor-induced input lag in games
windowrulev2 = immediate, fullscreen:1
windowrulev2 = immediate, fullscreen:0

# ── Halo Infinite / Gamescope específico ──
# Evita crash y caídas de FPS al cambiar de workspace (pérdida de foco en gamescope/Xwayland)
windowrulev2 = renderunfocused, class:^(steam_app_1240440)$
windowrulev2 = renderunfocused, title:^(Halo Infinite.*)$
windowrulev2 = renderunfocused, class:^(gamescope)$
# ── Halo Infinite: forzar fullscreen + sin bordes (borderless windowed fix) ──
windowrulev2 = fullscreen, class:^(steam_app_1240440)$
windowrulev2 = fullscreen, title:^(Halo Infinite.*)$
windowrulev2 = fullscreen, class:^(gamescope)$
windowrulev2 = fullscreenstate 2 2, class:^(steam_app_1240440)$
windowrulev2 = fullscreenstate 2 2, title:^(Halo Infinite.*)$
windowrulev2 = fullscreenstate 2 2, class:^(gamescope)$
windowrulev2 = noborder, class:^(steam_app_1240440)$
windowrulev2 = noborder, title:^(Halo Infinite.*)$
windowrulev2 = noborder, class:^(gamescope)$
windowrulev2 = idleinhibit focus, class:^(steam_app_1240440)$
windowrulev2 = idleinhibit focus, class:^(gamescope)$

# ─── Binds ───────────────────────────────────────────────────────────
# Mouse binds deshabilitados (limpieza 2026-07-31)
# bindm = SUPER, mouse:272, movewindow
# bindm = SUPER, mouse:273, resizewindow
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
# ── SWAL Control Center Menu ──
bind = SUPER SHIFT, C, exec, swal-config-menu
bind = SUPER ALT, T, exec, swal-theme-switch menu

# ── Atajos Mouse HyperX Pulsefire FPS (DESHABILITADOS 2026-07-31) ──
# bind = , mouse:274, exec, eww open --toggle dashboard
# bind = SUPER, mouse:275, exec, workspace, e-1
# bind = SUPER, mouse:276, exec, workspace, e+1

# ── Lanzamiento rápido de Apps (SUPER + CTRL + letra) ──
bind = SUPER CTRL, A, exec, antigravity
bind = SUPER CTRL, I, exec, antigravity-ide
bind = SUPER CTRL, B, exec, brave
bind = SUPER CTRL, C, exec, cursor
bind = SUPER CTRL, H, exec, steam steam://rungameid/1240440
bind = SUPER CTRL, K, exec, capcut
bind = SUPER CTRL, T, exec, tiktok-live-studio

# ─── Fix: Prevent cursor confinement barrier in games ────────────────────────

# ─── Fix: Prevent cursor confinement barrier in games ────────────────────────

# ─── Fix: Prevent cursor confinement barrier in games ────────────────────────
windowrule = [confinepointer=0] class:^(steam_app_.*)$
windowrule = [confinepointer=0] class:^(steam)$
