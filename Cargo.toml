[workspace]
members = [
    "crates/swal-telemetry-rs",
    "crates/swal-a2ui-engine",
    "crates/swal-ambient-orb",
    "crates/swal-node-daemon",
    "crates/swal-widget-vault",
    "crates/swal-render-pipeline",
    "crates/swal-files",
    "crates/swal-vision-rs",
    "crates/swal-pointer",
]
resolver = "2"

# Zero-warnings hygiene gate (Phase 4). Crates opt in via `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"
